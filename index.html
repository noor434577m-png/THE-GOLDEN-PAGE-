<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golden Page</title>
    <style>
        body { font-family: sans-serif; background-color: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ffd700; }
        #grid-container { display: grid; grid-template-columns: repeat(50, 15px); grid-gap: 2px; justify-content: center; margin: 20px auto; max-width: 900px; }
        
        /* تصميم البكسل */
        .pixel { width: 15px; height: 15px; background-color: #333; border: 1px solid #444; cursor: pointer; position: relative; background-size: cover; background-position: center; }
        .pixel.sold { cursor: pointer; border: 1px solid #ffd700; }
        .pixel.selected { background-color: #00ff00 !important; }
        
        /* مربع المعلومات عند تمرير الماوس */
        .tooltip { display: none; position: absolute; bottom: 20px; right: 50%; transform: translateX(50%); background: rgba(0,0,0,0.95); color: #fff; padding: 10px; border: 1px solid #ffd700; border-radius: 5px; width: 150px; z-index: 10; text-align: center; pointer-events: none; }
        .pixel:hover .tooltip { display: block; }
        .tooltip img { width: 100%; height: auto; border-radius: 3px; margin-bottom: 5px; }
        .tooltip a { color: #ffd700; text-decoration: none; font-size: 12px; word-break: break-all; display: block; }

        #controls { margin: 20px; }
        .input-group { margin: 10px 0; display: none; }
        .input-group input { padding: 8px; width: 250px; border-radius: 5px; border: 1px solid #ffd700; background: #222; color: #fff; text-align: center; margin: 5px 0; }
        button { background-color: #ffd700; border: none; color: #111; padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 5px; unsigned-shadow: none;}
        button:disabled { background-color: #555; color: #aaa; cursor: not-allowed; }
        #status-text { color: #ffd700; font-weight: bold; margin-top: 10px; }
    </style>
    <!-- تضمين حزم Firebase الـ CDN المتوافقة والمستقرة -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h1>The Golden Page ✨</h1>
    <p>اشترِ بكسلاتك الخاصة بـ 1 دولار (USDT) للبكسل الواحد واعرض إعلانك للجميع!</p>
    
    <div id="controls">
        <button id="connect-wallet">ربط المحفظة (Trust Wallet)</button>
        
        <div id="buyer-inputs" class="input-group">
            <input type="url" id="link-url" placeholder="رابط موقعك الإلكتروني (https://...)"><br>
            <input type="url" id="image-url" placeholder="رابط الصورة الشخصية أو الشعار (https://...)">
        </div>

        <button id="buy-btn" disabled>اشترِ البكسل المحدد (1 USDT)</button>
        <p id="status-text"></p>
    </div>

    <!-- شبكة الـ 2000 بكسل تظهر هنا -->
    <div id="grid-container"></div>

    <script>
        // --- 1. إعدادات قاعدة بيانات Firebase الموثقة الخاصة بك ---
        const firebaseConfig = {
            apiKey: "AIzaSyD-To1EM4IbuwxWg3jtedMiDmXyHeWUJQk",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "the-golden-page",
            storageBucket: "the-golden-page.firebasestorage.app",
            messagingSenderId: "486401864679",
            appId: "1:486401864679:web:f2ef889ee20fd3d6a44342"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- 2. إعدادات الدفع الآلي (شبكة BSC) ---
        const MY_WALLET_ADDRESS = "0x59BbA169436DD168499aA0808f5d2d0756ae4c83"; 
        const USDT_CONTRACT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955"; 
        const USDT_ABI = [ "function transfer(address to, uint256 amount) returns (bool)" ];

        let userWalletAddress = null;
        let selectedPixelId = null;
        let provider, signer;

        // توليد الـ 2000 مربع برمجياً فور تحميل الصفحة
        const gridContainer = document.getElementById('grid-container');
        const totalPixels = 2000;

        for (let i = 1; i <= totalPixels; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel');
            pixel.setAttribute('data-id', i);
            
            const tooltip = document.createElement('div');
            tooltip.classList.add('tooltip');
            pixel.appendChild(tooltip);

            pixel.addEventListener('click', function() {
                selectPixel(i);
            });
            gridContainer.appendChild(pixel);
        }

        // مراقبة قاعدة البيانات وتحديث المربعات المحجوزة حياً
        database.ref('pixels').on('value', function(snapshot) {
            const data = snapshot.val() || {};
            const allPixels = document.querySelectorAll('.pixel');
            
            allPixels.forEach(function(pixel) {
                const id = pixel.getAttribute('data-id');
                const tooltip = pixel.querySelector('.tooltip');
                
                if (data[id] && data[id].sold) {
                    pixel.classList.add('sold');
                    if (data[id].img) {
                        pixel.style.backgroundImage = "url('" + data[id].img + "')";
                    }
                    
                    // توليد المحتوى بطريقة دمج صلبة خالية من الأخطاء التنسيقية
                    let htmlContent = "";
                    if (data[id].img) {
                        htmlContent += "<img src='" + data[id].img + "' alt='Ad'>";
                    }
                    if (data[id].url) {
                        htmlContent += "<a href='" + data[id].url + "' target='_blank'>زيارة الموقع 🔗</a>";
                    } else {
                        htmlContent += "<span>تم الشراء</span>";
                    }
                    tooltip.innerHTML = htmlContent;
                    
                    pixel.onclick = function() {
                        if (data[id].url) window.open(data[id].url, '_blank');
                    };
                }
            });
        });

        // تحديد المربع المراد شراؤه
        function selectPixel(id) {
            const pixelDiv = document.querySelector(".pixel[data-id='" + id + "']");
            if (pixelDiv.classList.contains('sold')) return;

            document.querySelectorAll('.pixel').forEach(function(p) {
                p.classList.remove('selected');
            });
            pixelDiv.classList.add('selected');
            selectedPixelId = id;
            
            if (userWalletAddress) {
                document.getElementById('buy-btn').disabled = false;
            }
        }

        // حدث ربط المحفظة الرقمية
        document.getElementById('connect-wallet').addEventListener('click', async function() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userWalletAddress = await signer.getAddress();
                    
                    document.getElementById('connect-wallet').innerText = "متصل: " + userWalletAddress.substring(0, 6) + "...";
                    document.getElementById('buyer-inputs').style.display = "block";
                    document.getElementById('status-text').innerText = "تم ربط المحفظة بنجاح! اختر بكسل غير محجوز الآن.";
                    
                    if (selectedPixelId) {
                        document.getElementById('buy-btn').disabled = false;
                    }
                } catch (error) {
                    document.getElementById('status-text').innerText = "فشل ربط المحفظة، يرجى المحاولة مجدداً.";
                }
            } else {
                alert("يرجى التأكد من فتح موقعك الآن عبر متصفح الداب (DApp Browser) المدمج بداخل تطبيق Trust Wallet على الجوال.");
            }
        });

        // معالجة الخصم الآلي وحفظ التوثيق
        document.getElementById('buy-btn').addEventListener('click', async function() {
            if (!selectedPixelId || !signer) return;
            
            const linkUrl = document.getElementById('link-url').value;
            const imageUrl = document.getElementById('image-url').value;

            document.getElementById('status-text').innerText = "يرجى تأكيد إرسال الدفع من محفظتك...";
            
            try {
                const usdtContract = new ethers.Contract(USDT_CONTRACT_ADDRESS, USDT_ABI, signer);
                const amountToSend = ethers.utils.parseUnits("1.0", 18); 

                const tx = await usdtContract.transfer(MY_WALLET_ADDRESS, amountToSend);
                document.getElementById('status-text').innerText = "جاري تأكيد التوثيق على البلوكشين حالياً...";
                
                await tx.wait(); 

                await database.ref('pixels/' + selectedPixelId).set({
                    sold: true,
                    buyer: userWalletAddress,
                    url: linkUrl || "",
                    img: imageUrl || "",
                    timestamp: Date.now()
                });

                document.getElementById('status-text').innerText = "مبروك! تم الشراء ورفع إعلانك فوراً.";
                document.getElementById('buy-btn').disabled = true;
                document.querySelector(".pixel[data-id='" + selectedPixelId + "']").classList.remove('selected');

            } catch (error) {
                console.error(error);
                document.getElementById('status-text').innerText = "تم إلغاء المعاملة أو تعذر تأكيد الدفع.";
            }
