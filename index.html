<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golden Page ✨</title>
    <!-- مكتبة Ethers.js لربط محفظة Trust Wallet بشكل آلي ومباشر -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary-color: #ffd700;
            --bg-color: #0d0d11;
            --card-bg: #16161f;
            --pixel-color: #2a2a35;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: #ffffff; 
            margin: 0; 
            padding: 30px 10px; 
            text-align: center;
        }
        h1 { color: var(--primary-color); font-size: 2.5rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .info-p { color: #8e8e93; font-size: 1rem; margin-top: 0; margin-bottom: 30px; }
        
        #board-wrapper { width: 100%; overflow-x: auto; padding: 15px 0; }
        
        /* شكل وتصميم الشبكة الجديد بالكامل */
        #pixel-board { 
            display: grid; 
            grid-template-columns: repeat(50, 15px); 
            grid-template-rows: repeat(40, 15px); /* 50 عمود × 40 صف = 2000 بكسل تماماً */
            gap: 3px; 
            justify-content: center; 
            width: 900px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #242433;
        }
        
        /* تحويل الشكل إلى دوائر تفاعلية أنيقة وعصرية */
        .dot-pixel { 
            width: 15px; 
            height: 15px; 
            background-color: var(--pixel-color); 
            border-radius: 50%; /* تحويل المربع إلى دائرة */
            cursor: pointer; 
            transition: all 0.2s ease;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .dot-pixel:hover { 
            transform: scale(1.3); 
            background-color: var(--primary-color);
            box-shadow: 0 0 8px var(--primary-color);
            z-index: 5;
        }
        .dot-pixel.active-selection {
            background-color: #00ff66 !important;
            box-shadow: 0 0 10px #00ff66;
        }
        .dot-pixel.purchased {
            border: 1px solid var(--primary-color);
            cursor: pointer;
        }

        /* نافذة الشراء المنبثقة المطورة */
        #order-modal { 
            display: none; 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: #1c1c24; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            z-index: 100; 
            width: 90%; max-width: 340px; 
            border: 1px solid #2d2d3d;
        }
        #order-modal h3 { margin-top: 0; color: #fff; font-size: 1.3rem; }
        .wallet-card { 
            background: #252532; 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 0.85rem; 
            word-break: break-all; 
            margin: 15px 0; 
            color: #a1a1aa;
            border: 1px dashed var(--primary-color);
            text-align: right;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #2d2d3d; 
            border-radius: 10px; 
            background: #121218; 
            color: #fff; 
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--primary-color); outline: none; }
        .action-btn { 
            background: #00ff66; 
            color: #000; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1rem; 
            font-weight: bold; 
            margin-top: 15px;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #00cc52; }
        .cancel-btn { 
            background: transparent; 
            color: #ef4444; 
            border: 1px solid #ef4444; 
            padding: 10px; 
            border-radius: 10px; 
            width: 100%; 
            margin-top: 10px; 
            cursor: pointer;
            font-weight: 600;
        }
        .cancel-btn:hover { background: rgba(239, 68, 68, 0.1); }
        #overlay-screen { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); 
            z-index: 90; 
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <h1>✨ The Golden Page ✨</h1>
    <p class="info-p">امتلك مساحتك الإعلانية الدائمة على شكل دوائر ذهبية بـ 1 دولار فقط للبكسل!</p>

    <div id="board-wrapper">
        <div id="pixel-board"></div>
    </div>

    <div id="overlay-screen" onclick="closeOrderModal()"></div>
    
    <div id="order-modal">
        <h3>حجز مساحتك الخاصة</h3>
        <p style="font-size: 14px; color: #a1a1aa; margin: 5px 0;">الدائرة المحددة رقم: <span id="selected-dot-id" style="color: var(--primary-color); font-weight: bold;">0</span></p>
        
        <div class="wallet-card">
            <strong>المبلغ:</strong> 1.00 USDT (شبكة BSC)<br>
            <strong>المحفظة المستقبلة:</strong><br>
            <span style="color: #00ff66; font-family: monospace;">0x59BbA169436DD168499aA0808f5d2d0756ae4c83</span>
        </div>

        <input type="url" id="ad-logo" placeholder="رابط شعارك أو صورتك (https://...)">
        <input type="url" id="ad-link" placeholder="رابط موقعك الموجه للزوار (https://...)">
        
        <button class="action-btn" id="submit-payment-btn">ربط المحفظة والدفع الآلي</button>
        <button class="cancel-btn" onclick="closeOrderModal()">إلغاء الأمر</button>
    </div>

    <script>
        // إعدادات المسارات المباشرة لقاعدة بيانات الـ Firebase الخاصة بك
        var firebaseEndpoint = "https://firebaseio.com";
        
        // إعدادات الدفع الآلي لعملة USDT على شبكة Binance Smart Chain (BSC)
        const RECIPIENT_ADDRESS = "0x59BbA169436DD168499aA0808f5d2d0756ae4c83"; 
        const BSC_USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955"; 
        const ERC20_ABI = [ "function transfer(address to, uint256 amount) returns (bool)" ];

        var board = document.getElementById('pixel-board');
        var modal = document.getElementById('order-modal');
        var overlay = document.getElementById('overlay-screen');
        var dotIdDisplay = document.getElementById('selected-dot-id');
        var paymentBtn = document.getElementById('submit-payment-btn');
        
        var currentSelectionId = null;
        var maxDotsCount = 2000; // تم تحديث العدد لـ 2000 دائرة بكسل بناءً على طلبك

        // 1. توليد شبكة الدوائر الـ 2000 فوراً في أول سطر لضمان ظهور الموقع دائماً بدون أي تعليق
        for (var i = 1; i <= maxDotsCount; i++) {
            var dot = document.createElement('div');
            dot.className = 'dot-pixel';
            dot.id = 'dot-' + i;
            dot.title = 'مساحة رقم #' + i + ' - متوفرة بـ 1 دولار';
            attachModalTrigger(dot, i);
            board.appendChild(dot);
        }

        // 2. جلب وتحديث حالة المساحات المباعة فقط
        function syncPurchasedPixels() {
            fetch(firebaseEndpoint + ".json")
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (!data) return;
                    for (var i = 1; i <= maxDotsCount; i++) {
                        if (data[i]) {
                            var targetDot = document.getElementById('dot-' + i);
                            if (targetDot) {
                                targetDot.classList.add('purchased');
                                targetDot.style.backgroundImage = "url('" + data[i].logo + "')";
                                targetDot.title = 'إعلان رقم #' + i + ' - انقر لزيارة الموقع';
                                targetDot.style.backgroundColor = '#fff';
                                attachAdLink(targetDot, data[i].link);
                            }
                        }
                    }
                })
                .catch(function(err) { console.log("تم التعامل مع جلب الشبكة بأمان وثبات."); });
        }

        function attachAdLink(element, targetUrl) {
            element.onclick = function() { window.open(targetUrl, '_blank'); };
        }

        function attachModalTrigger(element, index) {
            element.onclick = function() {
                if (element.classList.contains('purchased')) return; 
                
                // إزالة التحديد السابق وتحديد الدائرة الجديدة
                document.querySelectorAll('.dot-pixel').forEach(d => d.classList.remove('active-selection'));
                element.classList.add('active-selection');
                
                currentSelectionId = index;
                dotIdDisplay.innerText = index;
                paymentBtn.innerText = "ربط المحفظة والدفع الآلي";
                paymentBtn.disabled = false;
                
                modal.style.display = 'block';
                overlay.style.display = 'block';
            };
        }

        window.closeOrderModal = function() {
            modal.style.display = 'none';
            overlay.style.display = 'none';
            document.querySelectorAll('.dot-pixel').forEach(d => d.classList.remove('active-selection'));
        };

        // هندسة الدفع التلقائي الآمن بداخل الحدث البرمجي لزر الحجز
