<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golden Page</title>
    
    <!-- استدعاء مكتبة Ethers.js لربط المحافظ بالبلوكشين -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #fcf8f2; color: #333; }
        .info-box { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); border: 1px solid #d4af37; }
        h1 { color: #d4af37; margin-bottom: 5px; }
        
        /* حاوية الخريطة الشبكية الكبيرة مع شريط تمرير لسهولة التصفح */
        .board-container { 
            margin: 25px auto; 
            overflow: auto; 
            max-width: 100%; 
            max-height: 80vh; 
            border: 3px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        
        /* لوحة الـ 2500 مربع (50 مربع عرض × 50 مربع ارتفاع) */
        #pixel-board { 
            position: relative; 
            width: 1500px; 
            height: 1500px; 
            background-color: #fff; 
            background-image: linear-gradient(to right, #f0f0f0 1px, transparent 1px), linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
            background-size: 30px 30px; 
            cursor: crosshair;
        }
        .user-pixel { 
            position: absolute; 
            width: 30px; 
            height: 30px; 
            box-sizing: border-box;
        }
        .user-pixel img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        /* النافذة المنبثقة لطلب الدفع بعد اختيار المربع */
        .modal {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.6); 
            z-index: 100; 
            justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border-top: 5px solid #d4af37; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 14px; }
        .btn-pay { background-color: #d4af37; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 95%; font-weight: bold; transition: background 0.2s; }
        .btn-pay:hover { background-color: #aa8c2c; }
        .btn-close { background-color: #f44336; margin-top: 8px; }
        .btn-close:hover { background-color: #d32f2f; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="info-box">
        <h1>The Golden Page</h1>
        <p>💡 **How to buy:** Click on any empty square inside the grid below to select it, enter your details, and complete the automated blockchain payment!</p>
        <p><strong>Price: 1 POL ($1) per square</strong> | Grid size: 2500 Squares available</p>
    </div>

    <!-- لوحة عرض الشبكة التفاعلية -->
    <div class="board-container">
        <div id="pixel-board"></div>
    </div>

    <!-- النافذة المنبثقة لطلب الدفع والنشر -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <h3>Configure Your Pixel</h3>
            <p>Selected Position: <strong id="selected-coords" style="color: #d4af37;">X: 0, Y: 0</strong></p>
            
            <input type="text" id="pixel-link" placeholder="Your Website URL (https://...)">
            <input type="text" id="pixel-image" placeholder="Direct Image URL (30x30 px recommended)">
            
            <button id="publish-btn" class="btn-pay">Pay 1 POL & Publish</button>
            <button id="close-btn" class="btn-pay btn-close">Cancel</button>
        </div>
    </div>

    <script>
        // --- ⚙️ الإعدادات المعتمدة والآمنة لموقعك ---
        const MY_WALLET_ADDRESS = "0x59BbA169436DD168499aA0808f5d2d0756ae4c83"; 
        const FIREBASE_URL = "https://firebaseio.com"; 
        const PIXEL_SIZE = 30; // حجم المربع الواحد 30 بكسل
        // -------------------------------------------

        const pixelBoard = document.getElementById('pixel-board');
        const paymentModal = document.getElementById('payment-modal');
        const publishButton = document.getElementById('publish-btn');
        const closeButton = document.getElementById('close-btn');
        const coordsText = document.getElementById('selected-coords');

        let currentX = 0;
        let currentY = 0;
        let takenPixels = {}; 

        // 1. تحميل البكسلات الحالية فور فتح الصفحة
        window.addEventListener('DOMContentLoaded', loadPixelsFromFirebase);

        function loadPixelsFromFirebase() {
            fetch(`${FIREBASE_URL}/pixels.json`)
            .then(response => response.json())
            .then(data => {
                pixelBoard.innerHTML = '';
                if (!data) return;
                takenPixels = data; 

                Object.keys(data).forEach(key => {
                    const pixel = data[key];
                    const [x, y] = key.split('_');

                    const pixelDiv = document.createElement('div');
                    pixelDiv.className = 'user-pixel';
                    pixelDiv.style.left = `${x}px`;
                    pixelDiv.style.top = `${y}px`;

                    const anchor = document.createElement('a');
                    anchor.href = pixel.link;
                    anchor.target = '_blank';

                    const img = document.createElement('img');
                    img.src = pixel.image;
                    img.onerror = () => { img.src = 'https://placeholder.com'; };

                    anchor.appendChild(img);
                    pixelDiv.appendChild(anchor);
                    pixelBoard.appendChild(pixelDiv);
                });
            })
            .catch(error => console.error("Error loading pixels:", error));
        }

        // 2. رصد نقرة الزبون لاختيار مربع فارغ
        pixelBoard.addEventListener('click', (e) => {
            const rect = pixelBoard.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // تقريب الإحداثيات لتتوافق مع المربعات تماماً
            currentX = Math.floor(clickX / PIXEL_SIZE) * PIXEL_SIZE;
            currentY = Math.floor(clickY / PIXEL_SIZE) * PIXEL_SIZE;

            // منع الضغط على المربعات المحجوزة مسبقاً
            if (takenPixels[`${currentX}_${currentY}`]) {
                alert("This square is already taken! Please choose an empty square.");
                return;
            }

            // فتح نافذة الدفع وإظهار الإحداثيات المحددة
            coordsText.innerText = `X: ${currentX}, Y: ${currentY}`;
            paymentModal.style.display = 'flex';
        });

        closeButton.addEventListener('click', () => { paymentModal.style.display = 'none'; });

        // 3. تفعيل الدفع الآلي بالبلوكشين عند النقر على التأكيد
        publishButton.addEventListener('click', async () => {
            const pixelLink = document.getElementById('pixel-link').value;
            const pixelImage = document.getElementById('pixel-image').value;

            if (!pixelLink || !pixelImage) {
                alert('Please enter both your Website URL and Image URL!');
                return;
            }

            if (typeof window.ethereum === 'undefined') {
                alert('No Crypto Wallet detected! Please use Trust Wallet browser or MetaMask plugin to purchase.');
                return;
            }

            try {
                publishButton.disabled = true;
                publishButton.innerText = "Connecting to wallet...";

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();

                const tx = {
                    to: MY_WALLET_ADDRESS,
                    value: ethers.utils.parseEther("1.0") // خصم 1 POL وإرسالها لمحفظتك
                };

                publishButton.innerText = "Please confirm payment in your wallet...";

                const transactionResponse = await signer.sendTransaction(tx);
                publishButton.innerText = "Confirming on Blockchain (Please wait)...";
                
                const receipt = await transactionResponse.wait();

                // في حال تأكيد البلوكشين للعملية بنسبة 100%، يتم الحفظ التلقائي
                if (receipt.status === 1) {
                    alert('Payment Confirmed! Publishing your pixel now...');
                    saveToFirebase(currentX, currentY, pixelLink, pixelImage);
                } else {
                    throw new Error("Blockchain transaction failed");
                }

            } catch (error) {
                console.error("Payment error:", error);
                alert("Payment cancelled or network error occurred. Please try again.");
                publishButton.disabled = false;
                publishButton.innerText = "Pay 1 POL & Publish";
            }
        });

        // 4. دالة الحفظ التلقائي في قاعدة البيانات
        function saveToFirebase(x, y, link, image) {
            const pixelData = { link: link, image: image, timestamp: Date.now() };

            fetch(`${FIREBASE_URL}/pixels/${x}_${y}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pixelData)
            })
