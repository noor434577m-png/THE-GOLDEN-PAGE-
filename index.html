<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golden Page</title>
    
    <!-- استدعاء مكتبة Ethers.js الرسمية للبلوكشين -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #fcf8f2; color: #333; margin: 0; }
        .info-box { max-width: 600px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); border: 1px solid #d4af37; }
        h1 { color: #d4af37; margin-bottom: 5px; }
        
        /* حاوية مرنة تمنع حظر المتصفحات وتدعم اللمس على الجوال */
        .board-container { 
            margin: 25px auto; 
            overflow: auto; 
            max-width: 95%; 
            border: 3px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            display: inline-block;
            background-color: #fff;
        }
        
        /* شبكة مادية صلبة من 2500 مربع (50 عمود × 50 صف) */
        #pixel-board { 
            display: grid;
            grid-template-columns: repeat(50, 15px); 
            grid-template-rows: repeat(50, 15px);    
            width: 750px; 
            height: 750px; 
            background-color: #fff; 
        }
        
        /* تصميم المربع الفارغ القابل للنقر الفوري */
        .grid-square {
            width: 15px;
            height: 15px;
            border: 1px solid #f0f0f0;
            box-sizing: border-box;
            cursor: crosshair;
            background-color: #fff;
        }
        .grid-square:hover {
            background-color: #ffeaa7; 
        }
        
        /* البكسلات المباعة المشغولة بالصور والروابط */
        .grid-square img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
            cursor: pointer;
        }

        /* النافذة المنبثقة لطلب البيانات والدفع */
        .modal {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.6); 
            z-index: 99999; 
            justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border-top: 5px solid #d4af37; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 14px; }
        .btn-pay { background-color: #d4af37; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 95%; font-weight: bold; transition: background 0.2s; }
        .btn-pay:hover { background-color: #aa8c2c; }
        .btn-close { background-color: #f44336; margin-top: 8px; }
        .btn-close:hover { background-color: #d32f2f; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="info-box">
        <h1>The Golden Page</h1>
        <p>💡 **How to buy:** Click on any empty square inside the grid below to select it, enter your details, and complete the automated blockchain payment!</p>
        <p><strong>Price: 1 POL ($1) per square</strong> | Grid size: 2500 Squares available</p>
    </div>

    <!-- حاوية عرض الشبكة -->
    <div class="board-container">
        <div id="pixel-board"></div>
    </div>

    <!-- النافذة المنبثقة لطلب الدفع والنشر -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <h3>Configure Your Pixel</h3>
            <p>Selected Position: <strong id="selected-coords" style="color: #d4af37;">X: 0, Y: 0</strong></p>
            
            <input type="text" id="pixel-link" placeholder="Your Website URL (https://...)">
            <input type="text" id="pixel-image" placeholder="Direct Image URL">
            
            <button id="publish-btn" class="btn-pay">Pay 1 POL & Publish</button>
            <button id="close-btn" class="btn-pay btn-close">Cancel</button>
        </div>
    </div>

    <script>
        // --- ⚙️ الإعدادات المعتمدة والآمنة لموقعك ---
        const MY_WALLET_ADDRESS = "0x59BbA169436DD168499aA0808f5d2d0756ae4c83"; 
        const FIREBASE_URL = "https://firebaseio.com"; 
        const GRID_ROWS = 50;
        const GRID_COLS = 50;
        // -------------------------------------------

        const pixelBoard = document.getElementById('pixel-board');
        const paymentModal = document.getElementById('payment-modal');
        const publishButton = document.getElementById('publish-btn');
        const closeButton = document.getElementById('close-btn');
        const coordsText = document.getElementById('selected-coords');

        let currentX = 0;
        let currentY = 0;
        let takenPixels = {}; 

        // تنفيذ فوري ومستقل لبناء المربعات فور فتح الصفحة لمنع الاختفاء
        window.addEventListener('DOMContentLoaded', () => {
            buildBlankGrid(); 
            loadPixelsFromFirebase(); 
        });

        // 1. دالة رسم الشبكة الفارغة فوراً (تضمن ظهور المربعات وقابليتها للضغط بشكل فوري ودون حظر)
        function buildBlankGrid() {
            pixelBoard.innerHTML = ''; 
            for (let row = 0; row < GRID_ROWS; row++) {
                for (let col = 0; col < GRID_COLS; col++) {
                    const xCoord = col * 15;
                    const yCoord = row * 15;
                    const pixelId = `square_${xCoord}_${yCoord}`;

                    const square = document.createElement('div');
                    square.className = 'grid-square';
                    square.id = pixelId;

                    // تفعيل حدث النقر الفوري المباشر والمستقل للمربع
                    square.onclick = function() {
                        if (takenPixels[`${xCoord}_${yCoord}`]) return; 
                        currentX = xCoord;
                        currentY = yCoord;
                        coordsText.innerText = `X: ${currentX}, Y: ${currentY}`;
                        paymentModal.style.display = 'flex';
                    };

                    pixelBoard.appendChild(square);
                }
            }
        }

        // 2. جلب البيانات من Firebase وتحديث المربعات المحجوزة في الخلفية دون تعطيل الصفحة
        function loadPixelsFromFirebase() {
            fetch(`${FIREBASE_URL}/pixels.json`)
            .then(response => response.json())
            .then(data => {
                if (!data) return;
                takenPixels = data; 

                Object.keys(data).forEach(key => {
                    const pixelData = data[key];
                    const [x, y] = key.split('_');
                    const targetSquare = document.getElementById(`square_${x}_${y}`);

                    if (targetSquare) {
                        targetSquare.innerHTML = ''; 
                        targetSquare.style.cursor = 'default';

                        const anchor = document.createElement('a');
                        anchor.href = pixelData.link;
                        anchor.target = '_blank';

                        const img = document.createElement('img');
                        img.src = pixelData.image;
                        img.onerror = () => { img.src = 'https://placeholder.com'; };

                        anchor.appendChild(img);
                        targetSquare.appendChild(anchor);
                    }
                });
            })
            .catch(error => console.error("Error updating grid from Firebase:", error));
        }

        closeButton.onclick = function() { paymentModal.style.display = 'none'; };

        // 3. دالة الدفع الآمن بالبلوكشين (تستدعى فقط عند ضغط زر الشراء النهائي)
        publishButton.onclick = async function() {
            const pixelLink = document.getElementById('pixel-link').value;
            const pixelImage = document.getElementById('pixel-image').value;

            if (!pixelLink || !pixelImage) {
                alert('Please enter both your Website URL and Image URL!');
                return;
            }

            // فحص وجود المحفظة لحماية الصفحة من الانهيار عند الزوار العاديين
            if (typeof window.ethereum === 'undefined') {
                alert('No Crypto Wallet detected! Please open this website inside your Trust Wallet App Browser or Metamask Browser to complete the payment.');
                return;
            }

            try {
                publishButton.disabled = true;
                publishButton.innerText = "Connecting to wallet...";

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();

                const tx = {
                    to: MY_WALLET_ADDRESS,
                    value: ethers.utils.parseEther("1.0") 
                };

                publishButton.innerText = "Please confirm payment in your wallet...";

                const transactionResponse = await signer.sendTransaction(tx);
                publishButton.innerText = "Confirming on Blockchain (Please wait)...";
                
                const receipt = await transactionResponse.wait();

                // شرط حماية أمان المتجر الأساسي: status === 1 يعني نجاح وصول الأموال لمحفظتك رسمياً
                if (receipt.status === 1) {
                    alert('Payment Confirmed! Publishing your pixel now...');
                    saveToFirebase(currentX, currentY, pixelLink, pixelImage);
                } else {
