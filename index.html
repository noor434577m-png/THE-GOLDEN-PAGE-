<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر بسكسلات البيكسل</title>
    
    <!-- 1. استدعاء مكتبة Ethers.js الرسمية لربط المحافظ بالبلوكشين -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 95%; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <h2>شراء ونشر بكسل بـ 1\$ فقط</h2>
        <p>سيتم الدفع بربط محفظتك مباشرة (شبكة Polygon - عملة POL)</p>
        
        <!-- حقول الإدخال للزبون -->
        <input type="text" id="pixel-link" placeholder="رابط موقعك (https://...)">
        <input type="text" id="pixel-image" placeholder="رابط صورة البكسل">
        <input type="number" id="pixel-x" placeholder="الإحداثي X">
        <input type="number" id="pixel-y" placeholder="الإحداثي Y">
        
        <!-- زر الدفع والنشر التلقائي الآمن -->
        <button id="publish-btn">اتصل بالمحفظة وانشر البكسل</button>
    </div>

    <script>
        // --- ⚙️ الإعدادات الرسمية والمؤكدة لموقعك ---
        const MY_WALLET_ADDRESS = "0x59BbA169436DD168499aA0808f5d2d0756ae4c83"; // محفظتك المربوطة
        const FIREBASE_URL = "https://the-golden-page-default-rtdb.firebaseio.com"; // رابط قاعدة بياناتك الصحيح
        // -------------------------------------------

        const publishButton = document.getElementById('publish-btn');

        publishButton.addEventListener('click', async () => {
            const pixelLink = document.getElementById('pixel-link').value;
            const pixelImage = document.getElementById('pixel-image').value;
            const pixelX = document.getElementById('pixel-x').value;
            const pixelY = document.getElementById('pixel-y').value;

            // 1. التأكد من إدخال البيانات كاملة
            if (!pixelLink || !pixelImage || !pixelX || !pixelY) {
                alert('الرجاء تعبئة جميع الحقول أولاً!');
                return;
            }

            // 2. التأكد من وجود محفظة (Web3) في المتصفح
            if (typeof window.ethereum === 'undefined') {
                alert('لم نجد محفظة مثبتة! يرجى فتح الموقع من داخل متصفح محفظة Trust Wallet أو تثبيت Metamask لإتمام الدفع الآلي.');
                return;
            }

            try {
                publishButton.disabled = true;
                publishButton.innerText = "جاري الاتصال بمحفظتك...";

                // طلب الإذن للاتصال بمحفظة الزبون
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();

                // إعداد الحوالة بقيمة 1 دولار من عملة الشبكة الأساسية (POL)
                const tx = {
                    to: MY_WALLET_ADDRESS,
                    value: ethers.utils.parseEther("1.0") 
                };

                publishButton.innerText = "برجاء تأكيد الدفع من تطبيق المحفظة...";

                // دفع الزبون للـ 1 دولار من محفظته
                const transactionResponse = await signer.sendTransaction(tx);
                publishButton.innerText = "جاري تأكيد المعاملة على البلوكشين (انتظر ثوانٍ)...";
                
                // الانتظار الفعلي حتى تنجح العملية على شبكة البلوكشين بالكامل
                const receipt = await transactionResponse.wait();

                // إذا كانت حالة التحويل ناجحة 100%، يتم النشر للزبون
                if (receipt.status === 1) {
                    alert('تم تأكيد وصول الـ 1\$ إلى محفظتك بنجاح! جاري النشر الآن...');
                    saveToFirebase(pixelX, pixelY, pixelLink, pixelImage);
                } else {
                    throw new Error("فشلت المعاملة على الشبكة");
                }

            } catch (error) {
                console.error("خطأ أثناء الدفع:", error);
                alert("تم إلغاء عملية الدفع أو حدث خطأ في الشبكة، يرجى المحاولة مجدداً.");
                publishButton.disabled = false;
                publishButton.innerText = "اتصل بالمحفظة وانشر البكسل";
            }
        });

        // دالة الرفع الآمن والتلقائي إلى Firebase
        function saveToFirebase(x, y, link, image) {
            const pixelData = {
                link: link,
                image: image,
                timestamp: Date.now()
            };

            fetch(`${FIREBASE_URL}/pixels/${x}_${y}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pixelData)
            })
            .then(response => {
                if (!response.ok) throw new Error('فشل الحفظ في قاعدة البيانات');
                return response.json();
            })
            .then(data => {
                alert('🎉 تم نشر البكسل والإعلان الخاص بك بنجاح آلي بالكامل!');
                location.reload(); // تحديث الصفحة لرؤية الإعلان الجديد
            })
            .catch(error => {
                console.error("Firebase Error:", error);
                alert("تم الدفع بنجاح والأموال في محفظتك، لكن حدثت مشكلة أثناء العرض على الموقع. يرجى مراسلة الإدارة لتنشيطه يدوياً.");
                publishButton.disabled = false;
                publishButton.innerText = "اتصل بالمحفظة وانشر البكسل";
            });
        }
    </script>
</body>
</html>
