<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Golden Page</title>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background-color: #fcf8f2; color: #333; margin: 0; }
        .info-box { max-width: 600px; margin: 10px auto; background: white; padding: 20px; border-radius: 12px; border: 1px solid #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #d4af37; margin: 0 0 10px 0; }
        
        .board-container { 
            margin: 20px auto; 
            overflow: auto; 
            max-width: 95%; 
            border: 3px solid #d4af37;
            border-radius: 8px;
            background-color: #fff;
            display: inline-block;
            position: relative;
        }
        
        /* إعدادات الشبكة المحدثة */
        #pixel-board { 
            position: relative;
            width: 800px; 
            height: 800px; 
            background-color: #ffffff; 
            background-image: linear-gradient(to right, #ccc 1px, transparent 1px), linear-gradient(to bottom, #ccc 1px, transparent 1px);
            background-size: 20px 20px; 
            cursor: crosshair;
            touch-action: none; 
        }
        
        /* صيغة البيكسل الجديدة لتفادي مشاكل عدم القابلية للضغط على الجوال */
        .user-pixel {
            position: absolute;
            width: 20px;
            height: 20px;
            box-sizing: border-box;
            z-index: 999;
        }
        .user-pixel a { display: block; width: 100%; height: 100%; pointer-events: auto; }
        .user-pixel img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

        .modal {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.6); 
            z-index: 99999; 
            justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 420px; text-align: center; border-top: 5px solid #d4af37; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .guide-text { background-color: #fff9e6; border: 1px solid #ffeaa7; padding: 10px; border-radius: 6px; font-size: 13px; text-align: right; margin-bottom: 15px; line-height: 1.5; color: #555; }
        input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 14px; }
        .wallet-options { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .btn-pay { color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; width: 95%; font-weight: bold; margin: auto; }
        .btn-mm { background-color: #f6851b; } 
        .btn-close { background-color: #f44336; margin-top: 5px; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="info-box">
        <h1>The Golden Page</h1>
        <p><strong>السعر: 1 POL (\$1) لكل مربع</strong> | حجم الشبكة: 1600 مربع</p>
    </div>

    <div class="board-container">
        <div id="pixel-board"></div>
    </div>

    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <h3>إعداد وشراء البيكسل</h3>
            <p>الموقع المحدد: <strong id="selected-coords" style="color: #d4af37;">X: 0, Y: 0</strong></p>
            
            <div class="guide-text">
                <strong>💡 إرشادات الدفع للجوال:</strong><br>
                قم بفتح الموقع من متصفح محفظة MetaMask أو Trust Wallet ليعمل الدفع التلقائي بنجاح.
            </div>

            <input type="text" id="pixel-link" placeholder="رابط موقعك الإعلاني (https://...)">
            <input type="text" id="pixel-image" placeholder="رابط مباشر للشعار الإعلاني (.png/.jpg)">
            
            <div class="wallet-options">
                <button id="btn-pay-now" class="btn-pay btn-mm">دفع وتشغيل الإعلان (1 POL)</button>
                <button id="close-btn" class="btn-pay btn-close">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // تنبيه هام جداً: تأكد من تغيير هذا الرابط برابط الفايربيس الخاص بك
        const FIREBASE_URL = "https://firebaseio.com"; 
        const MY_WALLET_ADDRESS = "0x59BbA169436DD168499aA0808f5d2d0756ae4c83"; 
        
        // الأبعاد القياسية الجديدة المعدلة (20 بيكسل بدلاً من 15)
        const PIXEL_SIZE = 20;
        const BOARD_WIDTH = 800;
        const BOARD_HEIGHT = 800;

        const pixelBoard = document.getElementById('pixel-board');
        const paymentModal = document.getElementById('payment-modal');
        const btnPayNow = document.getElementById('btn-pay-now');
        const closeButton = document.getElementById('close-btn');
        const coordsText = document.getElementById('selected-coords');

        let currentX = 0;
        let currentY = 0;
        let takenPixels = {}; 

        // جلب وعرض البيانات وحل مشكلة عدم القابلية للضغط
        function loadPixelsFromFirebase() {
            fetch(`${FIREBASE_URL}/pixels.json`)
            .then(res => res.json())
            .then(data => {
                if (!data) return;
                takenPixels = data; 
                
                const oldPixels = pixelBoard.querySelectorAll('.user-pixel');
                oldPixels.forEach(el => el.remove());

                Object.keys(data).forEach(key => {
                    const p = data[key];
                    if(!p) return;
                    const [x, y] = key.split('_');
                    
                    const pixelDiv = document.createElement('div');
                    pixelDiv.className = 'user-pixel';
                    pixelDiv.style.left = `${x}px`;
                    pixelDiv.style.top = `${y}px`;

                    pixelDiv.innerHTML = `<a href="${p.link}" target="_blank" rel="noopener"><img src="${p.image}"></a>`;
                    pixelBoard.appendChild(pixelDiv);
                });
            }).catch(err => console.log("Firebase Error:", err));
        }

        loadPixelsFromFirebase();

        // الدالة المحدثة بدقة لاحتساب الإحداثيات الجديدة ومقاومة التزحزح بالجوال
        function handleInteraction(clientX, clientY) {
            const rect = pixelBoard.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            currentX = Math.floor(clickX / PIXEL_SIZE) * PIXEL_SIZE;
            currentY = Math.floor(clickY / PIXEL_SIZE) * PIXEL_SIZE;

            if (currentX < 0 || currentX >= BOARD_WIDTH || currentY < 0 || currentY >= BOARD_HEIGHT) return;

            // إذا كان البيكسل محجوزاً مسبقاً، نتركه ليتولى الرابط نقله تلقائياً ولا نفتح نافذة الدفع
            if (takenPixels[`${currentX}_${currentY}`]) {
                return; 
            }

            coordsText.innerText = `X: ${currentX}, Y: ${currentY}`;
            paymentModal.style.display = 'flex';
        }

        // معالجة الضغطات للكمبيوتر والجوال وحفظ استجابة الروابط
        pixelBoard.addEventListener('click', function(e) {
            if (e.target !== pixelBoard) return; 
            handleInteraction(e.clientX, e.clientY);
        });

        pixelBoard.addEventListener('touchend', function(e) {
            if (e.target !== pixelBoard) return;
            e.preventDefault(); 
            const touch = e.changedTouches[0];
            handleInteraction(touch.clientX, touch.clientY);
        });

        closeButton.onclick = () => paymentModal.style.display = 'none';

        // الدفع التلقائي وحفظ البيانات فورا بعد نجاح العملية
        btnPayNow.onclick = async () => {
            const clientLink = document.getElementById('pixel-link').value.trim();
            const clientImage = document.getElementById('pixel-image').value.trim();

            if (!clientLink || !clientImage) {
                alert("يرجى ملء جميع الحقول أولاً!");
                return;
            }

            if (typeof window.ethereum === 'undefined') {
                alert("لم يتم اكتشاف محفظة مشفرة! يرجى فتح هذا الموقع من داخل متصفح تطبيق MetaMask أو Trust Wallet.");
                return;
            }

            try {
                btnPayNow.disabled = true;
                btnPayNow.innerText = "جاري الاتصال بالمحفظة...";

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();

                btnPayNow.innerText = "برجاء تأكيد الدفع (1 POL)...";

                const tx = await signer.sendTransaction({
                    to: MY_WALLET_ADDRESS,
                    value: ethers.utils.parseEther("1.0") 
                });

                btnPayNow.innerText = "جاري تأكيد المعاملة على الشبكة...";
                await tx.wait(); 

                btnPayNow.innerText = "جاري حفظ البيكسل وتحديث الموقع...";

                const pixelKey = `${currentX}_${currentY}`;
                const newPixelData = {};
                newPixelData[pixelKey] = {
                    link: clientLink,
                    image: clientImage,
                    txHash: tx.hash
                };

                await fetch(`${FIREBASE_URL}/pixels.json`, {
                    method: 'PATCH',
                    body: JSON.stringify(newPixelData)
                });

                alert("تهانينا! تم الشراء بنجاح وتحديث البيكسل الخاص بك تلقائياً.");
                paymentModal.style.display = 'none';
                loadPixelsFromFirebase(); 

            } catch (error) {
                console.error(error);
